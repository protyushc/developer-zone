<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="topFacetGradMask" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="glowMask" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Full-bleed background for maskable icon -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bgGradMask)"/>
  
  <!-- Scaled slightly (80%) to ensure it is 100% inside safe zone -->
  <g transform="translate(51.2, 51.2) scale(0.8)" filter="url(#glowMask)">
    <!-- Top Layer Isometric Diamond -->
    <polygon points="256 112, 396 188, 256 264, 116 188" 
             fill="url(#topFacetGradMask)" stroke="#38bdf8" stroke-width="18" stroke-linejoin="round" stroke-linecap="round"/>
    
    <!-- Code Bracket Symbol Inside Top Facet -->
    <path d="M 232 174 L 212 188 L 232 202" fill="none" stroke="#7dd3fc" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 280 174 L 300 188 L 280 202" fill="none" stroke="#7dd3fc" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="262" y1="172" x2="250" y2="204" stroke="#38bdf8" stroke-width="7" stroke-linecap="round"/>

    <!-- Middle Tier Isometric Layer -->
    <polyline points="116 264, 256 340, 396 264" 
              fill="none" stroke="#0ea5e9" stroke-width="18" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Bottom Tier Isometric Layer -->
    <polyline points="116 340, 256 416, 396 340" 
              fill="none" stroke="#0284c7" stroke-width="18" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
</svg>

